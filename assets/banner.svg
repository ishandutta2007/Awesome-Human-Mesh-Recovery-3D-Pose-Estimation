<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSmall" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -120; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        30% { opacity: 0.7; }
        70% { opacity: 0.7; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .floating-bg1 { animation: floatSlow 8s ease-in-out infinite; transform-origin: center; }
      .floating-bg2 { animation: floatReverse 9s ease-in-out infinite; transform-origin: center; }
      .pulsing-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .animated-dash { stroke-dasharray: 6 6; animation: dashMove 4s linear infinite; }
      .scanning-line { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Background Ambient Glow Orbs -->
  <circle cx="200" cy="120" r="220" fill="url(#orbGrad1)" class="pulsing-orb" filter="url(#glow)" />
  <circle cx="1020" cy="300" r="240" fill="url(#orbGrad2)" class="pulsing-orb" style="animation-delay: -3s;" filter="url(#glow)" />

  <!-- Perspective 3D Grid Floor in Background -->
  <g opacity="0.45">
    <rect width="1200" height="420" fill="url(#cyberGrid)" />
  </g>

  <!-- Dynamic Geometric Mesh Flow Lines (Behind Cards & Text) -->
  <g opacity="0.35">
    <path d="M 50 350 Q 300 200 600 280 T 1150 180" fill="none" stroke="#0ea5e9" stroke-width="2" class="animated-dash" />
    <path d="M 80 80 Q 400 320 750 120 T 1120 320" fill="none" stroke="#a855f7" stroke-width="1.8" class="animated-dash" style="animation-duration: 6s;" />
    <path d="M 0 210 C 350 100 850 350 1200 210" fill="none" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 8" />
  </g>

  <!-- Dynamic Wireframe Human Avatar / Skeleton (Right Side) -->
  <g class="floating-bg2" transform="translate(930, 200)">
    <!-- Aura Ring -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="8 8" class="animated-dash" opacity="0.6" />

    <!-- Scanning Line Effect -->
    <line x1="-120" y1="-140" x2="120" y2="-140" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" class="scanning-line" filter="url(#glowSmall)" />

    <!-- 3D Kinematic Pose Skeleton -->
    <!-- Head -->
    <circle cx="0" cy="-90" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowSmall)" />
    <!-- Neck & Spine -->
    <line x1="0" y1="-74" x2="0" y2="-40" stroke="#94a3b8" stroke-width="3" />
    <circle cx="0" cy="-40" r="5" fill="#38bdf8" />
    <line x1="0" y1="-40" x2="0" y2="20" stroke="#94a3b8" stroke-width="3" />
    <circle cx="0" cy="20" r="6" fill="#c084fc" />

    <!-- Shoulders & Arms -->
    <line x1="-45" y1="-40" x2="45" y2="-40" stroke="#94a3b8" stroke-width="3" />
    <line x1="-45" y1="-40" x2="-75" y2="5" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="-45" cy="-40" r="5" fill="#818cf8" />
    <circle cx="-75" cy="5" r="5" fill="#38bdf8" />
    <line x1="-75" y1="5" x2="-65" y2="55" stroke="#38bdf8" stroke-width="2" />
    <circle cx="-65" cy="55" r="4" fill="#38bdf8" />

    <line x1="45" y1="-40" x2="80" y2="-15" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="45" cy="-40" r="5" fill="#818cf8" />
    <circle cx="80" cy="-15" r="5" fill="#a855f7" />
    <line x1="80" y1="-15" x2="105" y2="25" stroke="#a855f7" stroke-width="2" />
    <circle cx="105" cy="25" r="4" fill="#c084fc" />

    <!-- Pelvis & Legs -->
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#94a3b8" stroke-width="3" />
    <line x1="-30" y1="20" x2="-45" y2="85" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="-30" cy="20" r="5" fill="#c084fc" />
    <circle cx="-45" cy="85" r="5" fill="#38bdf8" />
    <line x1="-45" y1="85" x2="-35" y2="145" stroke="#38bdf8" stroke-width="2" />
    <circle cx="-35" cy="145" r="4" fill="#38bdf8" />

    <line x1="30" y1="20" x2="55" y2="80" stroke="#a855f7" stroke-width="2.5" />
    <circle cx="30" cy="20" r="5" fill="#c084fc" />
    <circle cx="55" cy="80" r="5" fill="#a855f7" />
    <line x1="55" y1="80" x2="65" y2="140" stroke="#a855f7" stroke-width="2" />
    <circle cx="65" cy="140" r="4" fill="#c084fc" />

    <!-- Mesh Wireframe Poly Overlay -->
    <polygon points="0,-74 -45,-40 0,20" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3" />
    <polygon points="0,-74 45,-40 0,20" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-width="1" stroke-dasharray="2 3" />
    <polygon points="0,20 -30,20 -45,85" fill="#38bdf8" fill-opacity="0.08" />
    <polygon points="0,20 30,20 55,80" fill="#c084fc" fill-opacity="0.08" />
  </g>

  <!-- Left Dynamic Floating Card 1: 3D Tracking Metrics -->
  <g class="floating-bg1" transform="translate(60, 48)">
    <rect width="180" height="64" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="28" cy="32" r="12" fill="#0284c7" fill-opacity="0.3" />
    <circle cx="28" cy="32" r="5" fill="#38bdf8" />
    <text x="50" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">ESTIMATION SPEED</text>
    <text x="50" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">120+ FPS REALTIME</text>
  </g>

  <!-- Left Dynamic Floating Card 2: Expressive Mesh -->
  <g class="floating-bg2" transform="translate(60, 316)">
    <rect width="210" height="64" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="28" cy="32" r="12" fill="#7c3aed" fill-opacity="0.3" />
    <circle cx="28" cy="32" r="5" fill="#c084fc" />
    <text x="50" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">PARAMETRIC MODELS</text>
    <text x="50" y="46" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">SMPL • SMPL-X • MHR</text>
  </g>

  <!-- Main Foreground Content: Prominent Title & Subtitle (Guaranteed in Foreground) -->
  <g transform="translate(100, 140)">
    <!-- Badge / Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#10b981" />
      <text x="28" y="18" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.8">STATE-OF-THE-ART 3D VISION &amp; MOCAP</text>
    </g>

    <!-- Main Title with Gradient fill and crisp outline -->
    <text x="0" y="68" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Human Mesh Recovery
    </text>
    <text x="0" y="112" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      &amp; 3D Human Pose Estimation 🏃✨
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Curated open-source deep learning models, markerless motion capture, SMPL-X &amp; SaaS platforms.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 168)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="128" height="26" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="64" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎯 Monocular HMR</text>

      <!-- Pill 2 -->
      <rect x="138" y="0" width="134" height="26" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
      <text x="205" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ Markerless Mocap</text>

      <!-- Pill 3 -->
      <rect x="282" y="0" width="124" height="26" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
      <text x="344" y="17" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🧍 SMPL / SMPL-X</text>

      <!-- Pill 4 -->
      <rect x="416" y="0" width="120" height="26" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
      <text x="476" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎬 Blender DCC</text>

      <!-- Pill 5 -->
      <rect x="546" y="0" width="112" height="26" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="602" y="17" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">☁️ SaaS Studios</text>
    </g>
  </g>
</svg>
